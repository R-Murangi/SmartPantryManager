plugins {
    id 'com.android.application'
}

android {
    namespace 'za.co.student.smartpantry'
    compileSdk 34

    defaultConfig {
        applicationId 'za.co.student.smartpantry'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}

// Avoid duplicate Kotlin JDK7/JDK8 classes pulled in by older transitive libraries.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
